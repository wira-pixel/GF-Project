<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise for You</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Kotak Login -->
        <div id="login-box" class="card">
            <h1>Halo Sayang! 🌷</h1>
            <p>Masukkan kode rahasia yang cuma kamu yang tahu:</p>
            <input type="password" id="pin" placeholder="••••••">
            <button type="button" id="btn-login">Buka Kejutan</button>
            <p id="message" class="error-msg"></p>
        </div>

        <!-- Halaman Loading -->
        <div id="loading-box" style="display: none;">
            <div class="spinner-flower">🌸</div>
            <p class="loading-text">Sabar ya sayang<span class="dots"></span></p>
        </div>
    </div>

    <script>
        document.getElementById('btn-login').addEventListener('click', function() {
            const pinValue = document.getElementById('pin').value;
            
            // Ganti '123456' dengan PIN Anda
            if (pinValue === '123456') {
                // Tandai bahwa user sudah login dengan benar di sesi ini
                sessionStorage.setItem('isLoggedIn', 'true');

                document.getElementById('login-box').style.display = 'none';
                document.getElementById('loading-box').style.display = 'flex';

                // Jeda 2.5 detik untuk animasi loading yang estetik
                setTimeout(function() {
                    window.location.href = 'main.html';
                }, 2500);
            } else {
                document.getElementById('message').innerText = 'Yah, kodenya salah. Coba lagi sayang!';
            }
        });
    </script>
</body>
</html>
