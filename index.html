<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise for You</title>
    <!-- Tambahkan Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Halaman Login -->
        <div id="login-box" class="card">
            <h1>Halo Sayang! 🌷</h1>
            <p>Masukkan kode rahasia yang cuma kamu yang tahu:</p>
            <input type="password" id="pin" placeholder="••••••">
            <button onclick="checkPin()">Buka Kejutan</button>
            <p id="message" class="error-msg"></p>
        </div>

        <!-- Halaman Utama (Awalnya tersembunyi) --
        <div id="main-content" class="card" style="display: none;">
            <h1>Selamat Sidang Skripsi! ✨</h1>
            <p>Kamu wanita hebat, aku bangga banget sama kamu!</p>
            <div id="bouquet">
                <div class="flower" onclick="showMessage('Semangat ya cantiku!')">🌸</div>
                <div class="flower" onclick="showMessage('Sidang pasti lancar!')">🌷</div>
                <div class="flower" onclick="showMessage('Kamu wanita hebat!')">🌻</div>
            </div>
            <p id="gift-message"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
